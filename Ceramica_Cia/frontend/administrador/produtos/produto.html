<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Produto</title>
    <link rel="stylesheet" href="./produto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">\n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">\n</head>

<body>
    <header>
        <a href="../menu/menu.html" class="btn-voltar">← Menu</a>
        <h1>Gestão de Produtos</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastro de Produto</h2>

            <form id="produtoForm">
                <div class="search-container">
                    <label for="searchId">Buscar por ID:</label>
                    <div class="search-input-group">
                        <input type="number" id="searchId" placeholder="Digite o ID para buscar">
                        <button type="button" id="btnBuscar">🔍 Buscar</button>

                        <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                        <button type="button" id="btnAlterar" class="btn-secondary"
                            style="display: none;">Alterar</button>
                        <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                        <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
                    </div>
                </div>

                <fieldset id="formFields">
                    <legend>Dados do Produto</legend>

                    <div class="form-group">
                        <label for="nome_produto">Nome do produto:</label>
                        <input type="text" id="nome_produto" name="nome_produto" required>
                        <label for="categoria_id">Categoria:</label>
                        <select id="categoria_id" name="categoria_id" required>
                            <option value="">Carregando categorias...</option>
                        </select>
                        <label for="descricao_produto">Descrição:</label>
                        <textarea id="descricao_produto" name="descricao_produto" rows="3"></textarea>
                        <label for="quantidade_estoque_produto">Quantidade do produto no estoque:</label>
                        <input type="number" id="quantidade_estoque_produto" name="quantidade_estoque_produto" required>
                        <label for="preco_unitario_produto">Preço unitário do produto:</label>
                        <input type="number" id="preco_unitario_produto" name="preco_unitario_produto" required>

                        <div class="image-upload-group">
                            <img id="imgProdutoVisualizacao" src="" alt="Imagem do Produto 01">                           
                            <input type="file" id="imgProdutoInput" accept="image/*">
                            <input type="text" id="imgURL" placeholder="Ou insira a URL da imagem">
                            <input type="button" value="Carregar Imagem" id="btnCarregarImagem">
                        </div>

                    </div>
                </fieldset>
            </form>
        </section>

        <section class="list-section">
            <div class="table-container">
                <table id="produtosTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Estoque</th>
                            <th>Preço unitário</th>
                        </tr>
                    </thead>
                    <tbody id="produtosTableBody">
                        <!-- Dados serão carregados dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CRUD Produto</p>
    </footer>

    <div id="messageContainer" class="message-container"></div>

    <script src="./produto.js" defer></script>

</body>

</html>
