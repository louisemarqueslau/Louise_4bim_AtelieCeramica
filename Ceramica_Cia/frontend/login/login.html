<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | Cerâmica & Cia</title><link rel="stylesheet" href="/login/login.css"></head><body><main class="login-card"><a class="marca" href="/loja">✿ CERÂMICA <b>&</b> CIA</a><p class="subtitulo">Sua experiência artesanal começa aqui</p><section id="emailFrame"><h1>Bem-vinda(o)!</h1><p>Informe seu e-mail para continuar.</p><label for="email">E-mail</label><input type="email" id="email" placeholder="voce@email.com" required><button id="avancar">Continuar</button></section><section id="senhaFrame" hidden><h1>Que bom ter você de volta!</h1><p id="nomeUsuario"></p><label for="senha">Senha</label><input type="password" id="senha" placeholder="Sua senha" required><button id="entrar">Entrar</button><button class="link-voltar" id="esqueciSenha">Esqueci minha senha</button><button class="link-voltar" id="voltarEmail">Usar outro e-mail</button></section><section id="recuperarFrame" hidden><h1>Recuperar senha</h1><p>Enviaremos um código de segurança para seu e-mail.</p><label for="emailRecuperacao">E-mail</label><input id="emailRecuperacao" type="email" required><button id="enviarCodigo">Enviar código</button><label for="codigoRecuperacao">Código recebido</label><input id="codigoRecuperacao" inputmode="numeric" maxlength="6"><label for="senhaRecuperacao">Nova senha</label><input id="senhaRecuperacao" type="password" minlength="5"><button id="salvarSenhaRecuperada">Redefinir senha</button><button class="link-voltar" id="voltarLogin">Voltar ao login</button></section><section id="cadastroFrame" hidden><h1>Crie sua conta</h1><p>Preencha seus dados para continuar suas compras.</p><label for="cpf">CPF</label><input id="cpf" placeholder="Somente números" maxlength="20" required><label for="nome">Nome completo</label><input id="nome" autocomplete="name" required><label for="novoEmail">E-mail</label><input id="novoEmail" type="email" required><label for="novaSenha">Crie uma senha</label><input id="novaSenha" type="password" minlength="5" required><label for="endereco">Endereço</label><input id="endereco" required><button id="cadastrar">Criar conta</button><button class="link-voltar" id="voltarCadastro">Voltar</button></section><p id="mensagem" role="status"></p><p class="rodape-login"><a href="/loja">← Voltar para a loja</a></p></main><script src="/login/login.js"></script></body></html>
